name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes to the same branch are cancelled; the deploy workflow
# deliberately does the opposite.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The checks below run even when an earlier one fails, so a single run
      # reports every problem instead of stopping at the first.
      - name: Lint
        run: npm run check

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Type check and build
        if: ${{ !cancelled() }}
        run: npm run build
